name: Fetch SpeedRay Configs

# هر ۲۰ دقیقه یک‌بار کانفیگ‌ها را از سرورهای SpeedRay گرفته و
# نتیجه کامل را در configs.json داخل خود ریپو commit می‌کند.
on:
  schedule:
    - cron: "*/20 * * * *"   # هر ۲۰ دقیقه (به‌وقت UTC)
  workflow_dispatch:          # اجازه اجرای دستی از تب Actions

permissions:
  contents: write             # اجازه commit/push برای GITHUB_TOKEN

concurrency:
  group: fetch-configs        # جلوگیری از اجرای موازی همزمان
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pycryptodome

      - name: Fetch configs from all servers
        run: python fetch_configs.py

      - name: Commit and push configs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs.json
          if ! git diff --cached --quiet; then
            git commit -m "🔄 auto: update configs.json — $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "تغییری نبود — commit انجام نشد."
          fi
